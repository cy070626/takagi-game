<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>公式显示检查</title><link rel="stylesheet" href="./css/styles.css?v=98"><style>body{padding:24px;max-width:900px;margin:auto}.message{max-width:100%}.message p{min-width:0}.message .katex-display{overflow-x:auto;overflow-y:hidden;padding:.4em 0}.message .katex{white-space:nowrap;overflow-wrap:normal}button{padding:12px}</style><h1>公式显示检查</h1><p>正常公式、长公式、错误公式和 HTML 字符均应可见。</p><div id="examples"></div><script src="./js/main/math-display.js?v=98"></script><script>const texts=[String.raw`分数：\(\frac{1}{2}+\frac{1}{3}=\frac{5}{6}\)。😊`,String.raw`求根公式：$$x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}$$`,String.raw`矩阵：\[\begin{pmatrix}1&2\\3&4\end{pmatrix}\]`,String.raw`错误公式保留：\(\unknowncommand{1}\)`,String.raw`HTML 作为文字：<img src=x onerror=alert(1)>`];for(const text of texts){const row=document.createElement('div');row.className='message assistant';const p=document.createElement('p');p.textContent=text;row.append(p);document.querySelector('#examples').append(row);TakagiMathDisplay.render(p);}</script></html>
