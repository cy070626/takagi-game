<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高木同学 · 动态预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6ef;color:#37513b;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-size:26px}h2{font-size:20px}button,a{min-height:44px;padding:10px 16px;border-radius:22px;border:1px solid #cbd8c6;background:#fff;color:inherit;font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #638261}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stage{position:relative;min-height:210px;overflow:hidden;border-radius:20px;border:1px solid #d7e0d0;background:#fff;padding:20px}.message{max-width:66%;padding:14px;border-radius:16px;background:#eaf0e4}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.scene{position:relative;height:220px;overflow:hidden;border-radius:18px;background:#23302b}.scene img{width:100%;height:100%;object-fit:cover}.scene button{position:absolute;bottom:12px;left:12px;right:12px;background:#ffffffeb}.notice{font-size:14px;color:#687a65}.status{min-height:28px}@media(max-width:600px){main{padding:16px}.cards{grid-template-columns:1fr}.scene{height:200px}.message{max-width:70%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><h1>高木同学 · 动态预览</h1><p>点击按钮播放一次。动画不会循环，不需要 AI 密码或 API。</p><h2>聊天里的小回应</h2><div class="controls"><button id="chat-mode" type="button">小特效</button><button data-effect="cake">生日蛋糕</button><button data-effect="firework">小烟花</button><button data-effect="petal">樱花飘落</button><button data-effect="snow">雪花飘落</button><button data-effect="confetti">新年祝福</button></div><div id="chat-preview" class="stage"><small>高木</small><p class="message" id="preview-message">今天的座位，给你留好了。ふふっ。</p></div><p id="preview-status" class="notice status" role="status">完整烟花 12 条亮点，减少档 6 条；飘落效果减少档为 3 片。系统减少动态效果优先。</p><h2>场景动画与飘落效果</h2><div class="controls"><button id="music-mode" type="button">小特效</button></div><p id="scene-status" class="notice status" role="status">选择场景按钮观看动画。</p><div class="cards"><div class="scene" id="petal"><img src="../assets/music-scenes/sakura-path-thumb.webp" alt="樱花小路" width="960" height="540" decoding="async"><button data-scene="petal">樱花 · 播放花瓣</button></div><div class="scene" id="star"><img src="../assets/music-scenes/starry-night-thumb.webp" alt="星空之夜" width="960" height="540" loading="lazy" decoding="async"><button data-scene="star">星空 · 播放星光</button></div><div class="scene" id="firework"><img src="../assets/music-scenes/summer-festival-thumb.webp" alt="夏日祭典" width="960" height="540" loading="lazy" decoding="async"><button data-scene="firework">祭典 · 播放烟花</button></div><div class="scene" id="snow"><img src="../assets/music-scenes/winter-window-thumb.webp" alt="冬日窗边雪花演示" width="960" height="540" loading="lazy" decoding="async"><button data-scene="snow">雪花 · 独立演示</button></div></div><p class="notice">预览与正式页面使用同一份动画代码。音乐开关与正式场景共用偏好；聊天演示的开关只用于此预览。正式聊天无特效选择按钮，仅由词语触发。其他六个音乐场景没有粒子。雪花卡片仅供预览，不给音乐其他场景添加效果。</p><div class="controls"><a href="../index.html">返回主页面</a></div></main><script src="../js/subtle-effects.js?v=98"></script><script src="../js/effects-preview.js?v=98"></script></body></html>
